<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заметки</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='white'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='22' font-weight='bold' fill='black' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Inter:wght@400;600;700&family=Manrope:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg-primary:#ffffff;
  --bg-secondary:#f8f9fa;
  --bg-tertiary:#f1f3f4;
  --text-primary:#202124;
  --text-secondary:#5f6368;
  --text-tertiary:#9aa0a6;
  --accent:#1a73e8;
  --accent-hover:#1557b0;
  --border:#dadce0;
  --shadow-sm:0 1px 2px rgba(60,64,67,.3);
  --shadow-md:0 4px 12px rgba(60,64,67,.15);
  --shadow-lg:0 8px 24px rgba(60,64,67,.2);
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --transition:all .2s cubic-bezier(.4,0,.2,1)
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#f5f7fa 0%,#e8ecf1 100%);color:var(--text-primary);font-family:'IBM Plex Sans','Source Sans 3','Manrope','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.toolbar{position:sticky;top:0;z-index:100;width:100%;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);display:flex;align-items:center;padding:8px 16px;min-height:52px;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm)}
.hamburger{background:none;border:none;font-size:22px;cursor:pointer;padding:6px 8px;line-height:1;color:var(--text-primary);border-radius:var(--radius-sm);transition:var(--transition)}
.hamburger:hover{background:var(--bg-tertiary);transform:scale(1.05)}
.bottom-dock{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);border:1px solid var(--border);padding:8px 14px;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);transition:opacity .2s,var(--transition)}
.bottom-dock.hidden{opacity:0;pointer-events:none}
.dock-btn{background:var(--bg-secondary);color:var(--text-primary);border:none;padding:8px 12px;font-size:14px;cursor:pointer;font-family:inherit;border-radius:var(--radius-sm);line-height:1.3;white-space:nowrap;transition:var(--transition);display:flex;align-items:center;gap:6px}
.dock-btn:hover{background:var(--accent);color:#fff;transform:translateY(-2px);box-shadow:var(--shadow-md)}
.dock-btn:active,.dock-btn.active{background:var(--accent-hover);transform:translateY(0)}
.dock-sep{width:1px;height:24px;background:var(--border);display:inline-block;flex-shrink:0;margin:0 6px}
.dock-popup{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);z-index:151;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);display:none;gap:4px;padding:8px 10px;box-shadow:var(--shadow-lg);animation:popupSlide .2s ease}
@keyframes popupSlide{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.dock-popup.open{display:flex;align-items:center}
.dock-popup button{background:var(--bg-secondary);color:var(--text-primary);border:none;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;border-radius:var(--radius-sm);line-height:1.3;white-space:nowrap;transition:var(--transition)}
.dock-popup button:hover{background:var(--accent);color:#fff;transform:translateY(-1px)}
.dock-popup select{border:1px solid var(--border);padding:6px 10px;font-size:13px;font-family:inherit;border-radius:var(--radius-sm);outline:none;cursor:pointer;background:#fff;transition:var(--transition)}
.dock-popup select:hover{border-color:var(--accent)}
.ctx-menu{position:fixed;z-index:9999;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);display:none;gap:3px;padding:6px 8px;box-shadow:var(--shadow-lg);max-width:min(90vw,600px);overflow-x:auto;overflow-y:hidden;white-space:nowrap;animation:ctxMenuFade .15s ease}
@keyframes ctxMenuFade{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ctx-menu.open{display:flex;align-items:center}
.ctx-menu button{background:transparent;color:var(--text-primary);border:none;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;border-radius:var(--radius-sm);line-height:1.2;white-space:nowrap;transition:var(--transition)}
.ctx-menu button:hover{background:var(--bg-tertiary)}
.ctx-menu .ctx-sep{width:1px;height:18px;background:var(--border);display:inline-block;flex-shrink:0;margin:0 4px}
.dock-more-sep,.dock-more-btn{display:none}
.dock-popup-more{flex-wrap:wrap;max-width:90vw;max-height:60vh;overflow-y:auto;padding:8px}
.dock-popup-more .dock-sep{width:100%;height:1px;margin:4px 0;background:var(--border)}
.color-popup{display:none;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px;min-width:200px}
.color-popup.open{display:grid}
.color-popup .cp-label{grid-column:1/-1;font-size:11px;color:var(--text-tertiary);text-align:center;margin:2px 0;letter-spacing:.5px;font-weight:600;text-transform:uppercase}
.color-swatch{width:32px;height:32px;border:2px solid var(--border);cursor:pointer;border-radius:var(--radius-sm);padding:0;display:block;transition:var(--transition);box-shadow:var(--shadow-sm)}
.color-swatch:hover{border-color:var(--accent);transform:scale(1.15);box-shadow:var(--shadow-md)}
.dock-icon{height:18px;width:18px;vertical-align:middle;display:inline-block;filter:brightness(0.7)}
.dock-btn:hover .dock-icon{filter:brightness(1)}
.ctx-icon{height:14px;width:14px;vertical-align:middle;display:inline-block}
.sidebar-icon-img{height:16px;width:16px;vertical-align:middle;display:inline-block}
.sidebar-header .header-icon{height:18px;width:18px;vertical-align:middle;display:inline-block}
.btn-icon{height:16px;width:16px;vertical-align:middle;display:inline-block}
@media(max-width:600px){
  .dock-btn[data-popup="heading"],.dock-btn[data-popup="list"],.dock-btn[data-popup="align"],.dock-btn[data-popup="font"],.dock-btn[data-popup="color"],.dock-sep:not(.dock-more-sep),#checkboxBtn,#imageBtn,#linkNoteBtn,#widthBtn{display:none}
  #newNoteDockBtn{display:inline-flex}
  .dock-more-sep,.dock-more-btn{display:inline-flex}
  .bottom-dock{gap:4px;padding:6px 10px}
  .dock-btn{padding:6px 8px;font-size:13px}
}
.editor-wrapper{position:relative;width:100%;max-width:80%;margin:0 auto;padding:24px 24px 120px;transition:max-width .2s}
.editor-wrapper.drag-over #editor{background:var(--bg-tertiary)}
.editor-wrapper.drag-over::after{content:"Отпустите для вставки";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;color:var(--text-secondary);background:#fff;padding:20px 40px;border:2px dashed var(--accent);border-radius:var(--radius-md);z-index:10;pointer-events:none;box-shadow:var(--shadow-lg)}
.note-title-input{display:block;width:100%;border:none;outline:none;font-size:32px;font-weight:700;padding:12px 8px 8px;margin-bottom:20px;font-family:inherit;letter-spacing:-.5px;color:var(--text-primary);background:transparent}
.note-title-input::placeholder{color:var(--text-tertiary)}

#editor{min-height:60vh;outline:none;padding:0 4px;font-size:16px;line-height:1.7;word-wrap:break-word;text-align:justify;color:var(--text-primary)}
#editor::selection{background:var(--accent);color:#fff}
#editor:empty::before{content:"Начните писать...";color:var(--text-tertiary)}
#editor h1{font-size:2em;font-weight:700;margin:.6em 0 .6em;line-height:1.3;color:var(--text-primary)}
#editor h2{font-size:1.5em;font-weight:700;margin:.5em 0 .5em;line-height:1.3;color:var(--text-primary)}
#editor h3{font-size:1.25em;font-weight:600;margin:.4em 0 .4em;line-height:1.3;color:var(--text-primary)}
#editor p{margin:0 0 .5em}
#editor ul,#editor ol{padding-left:1.5em;margin:.3em 0}
#editor blockquote{border-left:4px solid var(--accent);padding-left:1em;margin:.5em 0;color:var(--text-secondary);background:var(--bg-secondary);padding:8px 12px;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
#editor img{max-width:100%;height:auto;margin:.3em .2em;display:inline-block;vertical-align:middle;cursor:pointer;border-radius:var(--radius-sm);transition:var(--transition)}
#editor img.img-selected{outline:2px solid var(--accent);outline-offset:2px;box-shadow:var(--shadow-md)}
#editor img.align-left{float:left;margin-right:1em;margin-top:.3em;margin-bottom:.3em}
#editor img.align-right{float:right;margin-left:1em;margin-top:.3em;margin-bottom:.3em}
#editor img.align-center{display:block;margin:.5em auto;clear:both}
#editor img.img-dragging{opacity:.4}
.img-drop-indicator{display:inline-block;width:3px;height:30px;background:var(--accent);vertical-align:middle;margin:0 2px;pointer-events:none;border-radius:2px}
.img-drag-handle{position:absolute;font-size:12px;color:#666;cursor:grab;user-select:none;z-index:52;display:none;line-height:1.2;padding:2px 5px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)}
.img-drag-handle:hover{display:block;background:var(--bg-secondary)}
#editor [contenteditable="false"]{user-select:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
#editor .todo-item{display:flex;align-items:flex-start;gap:4px;margin:.15em 0;padding:0;position:relative}
#editor .todo-item:first-child{margin-top:.5em}
#editor .todo-item:last-child{margin-bottom:.5em}
#editor .todo-checkbox{flex-shrink:0;font-size:1.5em;cursor:pointer;user-select:none;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:var(--transition)}
.todo-drag-handle{position:absolute;left:-22px;top:2px;width:18px;text-align:center;font-size:12px;color:var(--text-tertiary);cursor:grab;user-select:none;opacity:0;transition:opacity .1s;z-index:1}
.todo-item:hover .todo-drag-handle{opacity:1}
.todo-drag-handle:active{cursor:grabbing}
#editor .todo-text{flex:1;outline:none;min-height:1.3em;line-height:1.3}
#editor .todo-item.done .todo-text{text-decoration:line-through;color:var(--text-tertiary)}
#editor .todo-item.done .todo-checkbox{color:var(--text-tertiary)}
#editor .todo-item.todo-dragging{opacity:.4;background:var(--bg-secondary)}
.todo-item.todo-drop-above{border-top:2px solid var(--accent)}
.todo-item.todo-drop-below{border-bottom:2px solid var(--accent)}
.sidebar{position:fixed;top:0;left:0;width:280px;height:100vh;background:#fff;border-right:1px solid var(--border);z-index:300;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lg)}
.sidebar.open{transform:translateX(0)}
.sidebar-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:299;display:none;backdrop-filter:blur(2px)}
.sidebar-backdrop.show{display:block}
.sidebar-header{display:flex;align-items:center;gap:6px;padding:16px 18px 12px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600;cursor:pointer;color:var(--text-primary)}
.sidebar-header:hover{background:var(--bg-secondary)}
.sidebar-header .header-title{flex:1}
.sidebar-header button{background:none;border:1px solid var(--border);width:30px;height:30px;font-size:16px;cursor:pointer;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-family:inherit;transition:var(--transition);color:var(--text-primary)}
.sidebar-header button:hover{border-color:var(--accent);background:var(--bg-secondary);transform:scale(1.05)}
.sidebar-body{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;font-size:14px;border-radius:var(--radius-sm);margin:2px 8px;user-select:none;transition:var(--transition);color:var(--text-primary)}
.sidebar-item:hover{background:var(--bg-secondary)}
.sidebar-item.active{background:var(--accent);color:#fff;font-weight:600}
.sidebar-item.selected{font-weight:600}
.sidebar-item.dragging{opacity:.4}
.sidebar-item.drag-over{background:var(--bg-tertiary);outline:1px dashed var(--accent)}
.sidebar-folder-children .sidebar-item{padding-left:32px;background:var(--bg-secondary);margin-left:0;margin-right:0;border-radius:0}
.sidebar-folder-children .sidebar-item:hover{background:var(--bg-tertiary)}
.sidebar-folder-children .sidebar-item.active{background:var(--accent);color:#fff}
.sidebar-item .item-icon{font-size:15px;width:22px;text-align:center;flex-shrink:0}
.sidebar-item .item-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-item .item-actions{display:none;gap:2px;flex-shrink:0;margin-left:auto}
.sidebar-item:hover .item-actions{display:flex}
.sidebar-item .item-actions button{background:none;border:none;cursor:pointer;font-size:12px;padding:2px 4px;border-radius:var(--radius-sm);color:var(--text-tertiary);transition:var(--transition)}
.sidebar-item.long-press{background:var(--bg-tertiary)!important}
#noteContextMenu{position:fixed;z-index:500;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);padding:6px;min-width:180px;box-shadow:var(--shadow-lg);font-size:13px;font-family:inherit}
#noteContextMenu button{display:block;width:100%;text-align:left;background:none;border:none;padding:6px 10px;font-size:13px;cursor:pointer;border-radius:var(--radius-sm);font-family:inherit;transition:var(--transition);color:var(--text-primary)}
#noteContextMenu button:hover{background:var(--bg-secondary)}
#noteContextMenu .menu-label{font-size:11px;color:var(--text-tertiary);padding:2px 10px;margin-top:4px}
#noteContextMenu .menu-sep{border-top:1px solid var(--border);margin:4px 0}
.sidebar-item .item-actions button:hover{background:var(--bg-tertiary);color:var(--text-primary)}
.sidebar-folder-children{overflow:hidden;max-height:0;transition:max-height .2s}
.sidebar-folder-children.open{max-height:2000px}
.sidebar-item[data-type="folder"] .item-icon,.sidebar-note-group .item-icon{position:relative;width:22px;text-align:center;flex-shrink:0;font-size:15px}
.sidebar-item[data-type="folder"] .sidebar-folder-toggle,.sidebar-note-group .sidebar-folder-toggle{display:none;font-size:11px;color:var(--text-tertiary);transition:transform .2s}
.sidebar-item[data-type="folder"] .sidebar-folder-toggle.open,.sidebar-note-group .sidebar-folder-toggle.open{transform:rotate(90deg)}
.sidebar-item[data-type="folder"]:hover .sidebar-folder-toggle,.sidebar-note-group:hover .sidebar-folder-toggle,
.sidebar-item[data-type="folder"].folder-hover .sidebar-folder-toggle,.sidebar-note-group .sidebar-item.folder-hover .sidebar-folder-toggle{display:inline}
.sidebar-item[data-type="folder"]:hover .folder-emoji,.sidebar-note-group:hover .folder-emoji,
.sidebar-item[data-type="folder"].folder-hover .folder-emoji,.sidebar-note-group .sidebar-item.folder-hover .folder-emoji{display:none}
.sidebar-note-group .sidebar-folder-children .sidebar-item{padding-left:32px;background:var(--bg-secondary);margin-left:0;margin-right:0;border-radius:0}
.sidebar-empty{color:var(--text-tertiary);font-size:13px;text-align:center;padding:40px 20px}
.unfiled-zone{min-height:24px}
.unfiled-zone:empty::after{content:"Без папки";display:block;padding:12px 16px;font-size:12px;color:var(--text-tertiary);cursor:default}
.unfiled-zone.drag-over{outline:2px dashed var(--accent);background:var(--bg-secondary);min-height:48px;border-radius:var(--radius-sm)}
.sidebar-hotzone{position:fixed;top:0;left:0;width:5%;height:100vh;z-index:298;cursor:default;transition:background .2s}
.sidebar-hotzone:hover{background:rgba(0,0,0,.03)}
.emoji-picker{position:fixed;z-index:500;background:#fff;border:1px solid var(--border);padding:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:4px;box-shadow:var(--shadow-lg);border-radius:var(--radius-md)}
.emoji-picker button{background:none;border:none;font-size:20px;cursor:pointer;padding:4px;border-radius:var(--radius-sm);line-height:1;transition:var(--transition)}
.emoji-picker button:hover{background:var(--bg-secondary);transform:scale(1.1)}
.img-float-toolbar{position:absolute;display:flex;gap:4px;background:#fff;border:1px solid var(--border);padding:4px 8px;z-index:50;font-size:12px;white-space:nowrap;box-shadow:var(--shadow-md);border-radius:var(--radius-sm)}
.img-float-toolbar button{background:none;border:1px solid var(--border);padding:2px 8px;cursor:pointer;color:var(--text-primary);font-size:11px;font-family:inherit;border-radius:var(--radius-sm);transition:var(--transition)}
.img-float-toolbar button:hover{border-color:var(--accent);background:var(--bg-secondary)}
.img-resize-handle{position:absolute;width:14px;height:14px;background:var(--accent);border:2px solid #fff;cursor:nwse-resize;z-index:51;bottom:-7px;right:-7px;box-shadow:var(--shadow-sm);border-radius:var(--radius-sm)}
.crop-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.65);z-index:1000;display:flex;align-items:center;justify-content:center;cursor:crosshair;backdrop-filter:blur(4px)}
.crop-wrap{position:relative;display:inline-block;line-height:0}
.crop-wrap img{display:block;max-width:92vw;max-height:82vh;min-width:200px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg)}
.crop-region{position:absolute;border:2px dashed #fff;cursor:move;box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
.crop-handle{position:absolute;width:16px;height:16px;background:#fff;border:2px solid var(--accent);z-index:10;border-radius:var(--radius-sm)}
.crop-handle.nw{top:-8px;left:-8px;cursor:nwse-resize}
.crop-handle.ne{top:-8px;right:-8px;cursor:nesw-resize}
.crop-handle.sw{bottom:-8px;left:-8px;cursor:nesw-resize}
.crop-handle.se{bottom:-8px;right:-8px;cursor:nwse-resize}
.crop-handle.n{top:-8px;left:50%;margin-left:-8px;cursor:ns-resize}
.crop-handle.s{bottom:-8px;left:50%;margin-left:-8px;cursor:ns-resize}
.crop-handle.e{right:-8px;top:50%;margin-top:-8px;cursor:ew-resize}
.crop-handle.w{left:-8px;top:50%;margin-top:-8px;cursor:ew-resize}
.crop-actions{position:absolute;bottom:-44px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.crop-actions button{background:var(--accent);color:#fff;border:none;padding:6px 20px;cursor:pointer;font-size:13px;font-family:inherit;border-radius:var(--radius-sm);transition:var(--transition)}
.crop-actions button:hover{opacity:.9;transform:translateY(-1px)}
.crop-actions button.crop-cancel{background:#fff;color:var(--text-primary);border:1px solid var(--border)}
.width-handle{position:fixed;top:0;right:0;width:3px;height:100vh;background:transparent;cursor:ew-resize;z-index:200;transition:background .2s}
.width-handle:hover,.width-handle.active{background:var(--accent)}
.width-label{position:fixed;bottom:12px;right:14px;font-size:11px;color:var(--text-tertiary);letter-spacing:.5px;pointer-events:none;user-select:none}
.width-panel{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:151;background:#fff;border:1px solid var(--border);padding:16px 24px;border-radius:var(--radius-md);display:none;box-shadow:var(--shadow-lg)}
.width-panel.open{display:flex;align-items:center;gap:10px}
.width-panel input[type="range"]{width:260px;height:6px;cursor:ew-resize;accent-color:var(--accent)}
.width-panel .wp-label{font-size:13px;color:var(--text-secondary);min-width:36px;text-align:center}
.link-panel{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:151;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);display:none;box-shadow:var(--shadow-lg);width:320px;max-height:360px;flex-direction:column}
.link-panel.open{display:flex}
.link-panel-header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border)}
.link-search{flex:1;border:none;outline:none;font-size:13px;font-family:inherit;padding:4px 0;color:var(--text-primary)}
.link-search::placeholder{color:var(--text-tertiary)}
.link-new{font-size:12px;color:var(--text-primary);cursor:pointer;white-space:nowrap;padding:4px 8px;border:1px solid var(--border);border-radius:var(--radius-sm);transition:var(--transition)}
.link-new:hover{border-color:var(--accent);background:var(--bg-secondary)}
.link-list{flex:1;overflow-y:auto;padding:4px 0}
.link-item{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;font-size:13px;border-radius:var(--radius-sm);transition:var(--transition);color:var(--text-primary)}
.link-item:hover{background:var(--bg-secondary)}
.link-item .li-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.link-item .li-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#editor .note-ref{display:inline;cursor:pointer;text-decoration:underline;text-underline-offset:2px;user-select:none;font-size:inherit;color:var(--accent)}
#editor .note-ref:hover{color:var(--accent-hover)}
.save-indicator{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--text-tertiary);background:#fff;padding:4px 12px;border:1px solid var(--border);border-radius:12px;opacity:0;transition:opacity .3s;box-shadow:var(--shadow-sm)}
.save-indicator.show{opacity:1}
.save-dot{width:18px;height:18px;border-radius:50%;display:inline-block;transition:background .3s;background:transparent;flex-shrink:0}
.save-dot.unsaved{background:#f90}
.save-dot.saving{background:var(--text-tertiary);animation:save-dot-spin .8s linear infinite}
.save-dot.saved{background:#090}
@keyframes save-dot-spin{0%{background:var(--text-tertiary);box-shadow:inset 2px 0 0 0 #fff,inset -2px 0 0 0 transparent}50%{background:var(--text-secondary);box-shadow:inset -2px 0 0 0 #fff,inset 2px 0 0 0 transparent}100%{background:var(--text-tertiary);box-shadow:inset 2px 0 0 0 #fff,inset -2px 0 0 0 transparent}}
.user-btn{background:var(--bg-secondary);border:1px solid var(--border);padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;border-radius:var(--radius-sm);color:var(--text-primary);margin-left:auto;transition:var(--transition)}
.user-btn:hover{border-color:var(--accent);background:var(--accent);color:#fff}
.auth-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.98);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.auth-box{width:340px;padding:40px 32px;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);background:#fff}
.auth-box h1{font-size:24px;font-weight:700;margin-bottom:4px;color:var(--text-primary)}
.auth-box p{font-size:13px;color:var(--text-secondary);margin-bottom:24px}
.auth-box label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:var(--text-primary)}
.auth-box input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;margin-bottom:16px;outline:none;transition:var(--transition)}
.auth-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,115,232,.1)}
.auth-box button{width:100%;padding:10px;background:var(--accent);color:#fff;border:none;font-size:14px;cursor:pointer;border-radius:var(--radius-sm);font-family:inherit;transition:var(--transition);font-weight:600}
.auth-box button:hover{opacity:.9;transform:translateY(-1px);box-shadow:var(--shadow-md)}
.auth-box button:disabled{opacity:.4;cursor:default}
.auth-box .auth-switch{text-align:center;margin-top:12px;font-size:13px;color:var(--text-secondary)}
.auth-box .auth-switch a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:600}
.auth-box .auth-switch a:hover{text-decoration:underline}
.auth-box .auth-error{color:#d93025;font-size:12px;margin-bottom:12px;display:none}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:9998;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border:1px solid var(--border);padding:28px 32px 20px;min-width:300px;max-width:400px;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)}
.modal-text{font-size:14px;margin-bottom:20px;line-height:1.5;color:var(--text-primary)}
.modal-input{display:block;width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;outline:none;margin-bottom:16px;box-sizing:border-box;transition:var(--transition)}
.modal-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,115,232,.1)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.modal-actions button{padding:6px 20px;font-size:13px;cursor:pointer;font-family:inherit;border-radius:var(--radius-sm);transition:var(--transition)}
.modal-cancel{background:#fff;color:var(--text-primary);border:1px solid var(--border)}
.modal-ok{background:var(--accent);color:#fff;border:none;font-weight:600}
.modal-ok:hover{opacity:.9;transform:translateY(-1px);box-shadow:var(--shadow-md)}
.modal-cancel:hover{background:var(--bg-secondary)}
</style>
</head>

<script>
// ─── Firebase ──────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyCtXddMEjLZMVMcdOakUc-FFAodtce4DOk",
  authDomain: "risnotes-49c3e.firebaseapp.com",
  projectId: "risnotes-49c3e",
  storageBucket: "risnotes-49c3e.firebasestorage.app",
  messagingSenderId: "671851107991",
  appId: "1:671851107991:web:cc5ab15932a8f2dc72fbd2",
  measurementId: "G-DETHHDC8KD"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
db.settings({ merge: true });

// ─── Modal ─────────────────────────────────────────────
const modalOverlay=document.getElementById('modalOverlay'), modalBox=document.getElementById('modalBox'), modalText=document.getElementById('modalText'), modalInput=document.getElementById('modalInput'), modalActions=document.getElementById('modalActions'), modalCancel=document.getElementById('modalCancel'), modalOk=document.getElementById('modalOk');
function showConfirm(msg,cancelText,okText){return new Promise(r=>{modalOverlay.classList.add('show');modalInput.style.display='none';modalText.textContent=msg;modalCancel.textContent=cancelText||'Отмена';modalOk.textContent=okText||'ОК';const h=()=>{modalOverlay.classList.remove('show');modalCancel.removeEventListener('click',onCancel);modalOk.removeEventListener('click',onOk);};const onCancel=()=>{h();r(false);};const onOk=()=>{h();r(true);};modalCancel.addEventListener('click',onCancel);modalOk.addEventListener('click',onOk);});}
function showPrompt(msg,val){return new Promise(r=>{modalOverlay.classList.add('show');modalInput.style.display='block';modalInput.value=val||'';modalText.textContent=msg;modalCancel.textContent='Отмена';modalOk.textContent='ОК';modalInput.focus();modalInput.select();const h=()=>{modalOverlay.classList.remove('show');modalCancel.removeEventListener('click',onCancel);modalOk.removeEventListener('click',onOk);modalInput.removeEventListener('keydown',onKey);};const onCancel=()=>{h();r(null);};const onOk=()=>{h();r(modalInput.value.trim()||null);};const onKey=e=>{if(e.key==='Enter')onOk();if(e.key==='Escape')onCancel();};modalCancel.addEventListener('click',onCancel);modalOk.addEventListener('click',onOk);modalInput.addEventListener('keydown',onKey);});}

// ─── Data ──────────────────────────────────────────────
let data = { folders: [], notes: {}, activeNoteId: null, sidebarOpen: false, selectedFolderId: null };
let activeNoteId = null;
let sidebarOpen = false;
let userId = null;
let dragNoteId = null;
let selectedImg = null, floatToolbar = null, resizeHandle = null, resizeState = null;
let cropState = null;
let saveTimer = null;
let lastSavedData = null;
let lastEditTime = 0;
let unsubSnapshot = null;
let hoverOpened = false;
let sidebarHoverTimer = null;

const EMOJIS = ['📄','📝','📋','📌','⭐','❤️','💡','🎯','📊','🔖','📁','📂','🗂️','📎','🔗','📐','🎨','💻','📱','🖥️','📚','✏️','🖊️','🔍','🔒','🔓','✅','❌','🔄','📤','📥','🗑️','⚙️','🔔','🔕','💬','👤','👥','🔢','📅','📈','📉','📋','💼','🏠','✈️','🚀','🎵','🎬','📷','☀️','🌙','🌈','⭐','🔥','💧','🌿','🍀','💎','🧩'];

function generateId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function getOrderedNotes(n) { return [...n].sort((a, b) => (a.order||0) - (b.order||0)); }
function getActiveNote() { return activeNoteId ? data.notes[activeNoteId] : null; }
function getFolders() { return data.folders || []; }
function getNotesInFolder(fid) { return getOrderedNotes(Object.values(data.notes||{}).filter(n => n.folderId === fid && !n.isChildNote)); }
function getUnfiledNotes() { return getOrderedNotes(Object.values(data.notes||{}).filter(n => !n.folderId && !n.isChildNote)); }
function renderIcon(icon) { if(icon==='note')return '<img class="sidebar-icon-img" src="icons/note.png" alt="Зам">'; if(icon==='file')return '<img class="sidebar-icon-img" src="icons/file.png" alt="Папка">'; return icon||'📄'; }

// ─── Auth ──────────────────────────────────────────────
const authOverlay = document.getElementById('authOverlay');
const authTitle = document.getElementById('authTitle');
const authSubtitle = document.getElementById('authSubtitle');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authBtn = document.getElementById('authBtn');
const authError = document.getElementById('authError');
const authSwitchLink = document.getElementById('authSwitchLink');
const authSwitchText = document.getElementById('authSwitchText');
let isRegister = false;

authSwitchLink.addEventListener('click', () => {
  isRegister = !isRegister;
  authTitle.textContent = isRegister ? 'Регистрация' : 'Вход';
  authSubtitle.textContent = isRegister ? 'Создайте новую учётную запись' : 'Войдите в свою учётную запись';
  authBtn.textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
  authSwitchText.textContent = isRegister ? 'Уже есть аккаунт?' : 'Нет аккаунта?';
  authSwitchLink.textContent = isRegister ? 'Войти' : 'Зарегистрироваться';
  authError.style.display = 'none';
});

function doAuth() {
  const email = authEmail.value.trim();
  const pass = authPassword.value;
  if (!email) { authError.textContent = 'Введите email'; authError.style.display = 'block'; return; }
  if (!pass || pass.length < 6) { authError.textContent = 'Пароль минимум 6 символов'; authError.style.display = 'block'; return; }
  authError.style.display = 'none';
  authBtn.disabled = true;
  (isRegister ? auth.createUserWithEmailAndPassword(email, pass) : auth.signInWithEmailAndPassword(email, pass))
    .then(() => authOverlay.style.display = 'none')
    .catch(err => {
      const m = { 'auth/user-not-found':'Пользователь не найден','auth/wrong-password':'Неверный пароль','auth/email-already-in-use':'Email уже используется','auth/invalid-email':'Неверный email','auth/weak-password':'Слишком простой пароль','auth/too-many-requests':'Слишком много попыток' };
      authError.textContent = m[err.code] || err.message;
      authError.style.display = 'block';
    })
    .finally(() => authBtn.disabled = false);
}
authBtn.addEventListener('click', doAuth);
authEmail.addEventListener('keydown', e => { if (e.key === 'Enter') authPassword.focus(); });
authPassword.addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });

// ─── Firestore ─────────────────────────────────────────
async function loadDataFromFirestore() {
  if (!userId) return null;
  const doc = await db.collection('users').doc(userId).get();
  if (doc.exists) { const d = doc.data(); d.selectedFolderId = d.selectedFolderId || null; if (!d.notes || Object.keys(d.notes).length === 0) { const nid = generateId(); d.notes = { [nid]: { id: nid, title: 'Первая заметка', icon: 'note', content: '', refNoteIds: [], folderId: null, order: 1000, createdAt: Date.now(), updatedAt: Date.now() } }; d.activeNoteId = nid; } return d; }
  const nid = generateId();
  return { folders: [], notes: { [nid]: { id: nid, title: 'Первая заметка', icon: 'note', content: '', refNoteIds: [], folderId: null, order: 1000, createdAt: Date.now(), updatedAt: Date.now() } }, activeNoteId: nid, sidebarOpen: false, selectedFolderId: null };
}
const saveDot=document.getElementById('saveDot');
function setSaveDot(state){saveDot.className='save-dot';if(state)saveDot.classList.add(state);}
function saveDataToFirestore() {
  if (!userId) return;
  if (!data.notes || Object.keys(data.notes).length === 0) { setSaveDot(null); return; }
  clearTimeout(saveTimer); setSaveDot('unsaved');
  saveTimer = setTimeout(() => {
    setSaveDot('saving');
    data.activeNoteId = activeNoteId;
    data.sidebarOpen = sidebarOpen;
    const saved=JSON.stringify(data.notes||{});
    db.collection('users').doc(userId).set(data).then(()=>{lastSavedData=saved;setSaveDot('saved');setTimeout(()=>{if(saveDot.classList.contains('saved'))setSaveDot(null);},2000);}).catch(e =>{setSaveDot(null);console.error(e);});
  }, 500);
}
function flushSave() {
  const n=getActiveNote(); if(n){n.content=editor.innerHTML;n.title=noteTitleInput.value.trim()||'Без названия';n.updatedAt=Date.now();n.refNoteIds=[...editor.querySelectorAll('.note-ref')].map(el=>el.dataset.noteId).filter(Boolean);}
  if (!userId||!data.notes||Object.keys(data.notes).length===0) return;
  clearTimeout(saveTimer); data.activeNoteId=activeNoteId; data.sidebarOpen=sidebarOpen;
  const saved=JSON.stringify(data.notes||{});
  db.collection('users').doc(userId).set(data).then(()=>lastSavedData=saved).catch(e=>console.error(e));
}
window.addEventListener('beforeunload',flushSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushSave();});

auth.onAuthStateChanged(async user => {
  if (user) {
    userId = user.uid;
    document.getElementById('userBtn').textContent = user.email;
    document.getElementById('userBtn').style.display = 'block';
    authOverlay.style.display = 'none';
    data = await loadDataFromFirestore();
    activeNoteId = data.activeNoteId || null;
    sidebarOpen = data.sidebarOpen || false;
    initApp();
    lastSavedData = JSON.stringify(data.notes||{});
    lastEditTime = Date.now();
    if (unsubSnapshot) unsubSnapshot();
    unsubSnapshot = db.collection('users').doc(userId).onSnapshot(snap => {
      if (!snap.exists) return;
      const r = snap.data();
      const rn = JSON.stringify(r.notes||{});
      if (rn === lastSavedData) return;
      if (Date.now() - lastEditTime < 3000) return;
      const prevId = activeNoteId;
      const prevContent = editor.innerHTML;
      const prevTitle = noteTitleInput.value.trim()||'Без названия';
      const prevRef = [...editor.querySelectorAll('.note-ref')].map(el=>el.dataset.noteId).filter(Boolean);
      const hadNote = prevId && data.notes && data.notes[prevId];
      data = r;
      data.selectedFolderId = data.selectedFolderId || null;
      if (hadNote && data.notes[prevId]) {
        data.notes[prevId].content = prevContent;
        data.notes[prevId].title = prevTitle;
        data.notes[prevId].refNoteIds = prevRef;
        data.notes[prevId].updatedAt = Date.now();
        loadNoteIntoEditor(prevId);
        saveDataToFirestore();
      } else {
        const k=Object.keys(data.notes||{});
        if(k.length){activeNoteId=k[0];data.activeNoteId=k[0];loadNoteIntoEditor(k[0]);}
        else {activeNoteId=null;editor.innerHTML='';}
      }
      activeNoteId = activeNoteId || null;
      renderSidebar();
    });
  } else {
    userId = null;

function closeSidebarHover() { clearTimeout(sidebarHoverTimer); if (hoverOpened) { hoverOpened = false; sidebarOpen = false; sidebar.classList.remove('open'); sidebarBackdrop.classList.remove('show'); } }

// Touch swipe to open sidebar
let touchStartX=0, touchStartY=0;
document.addEventListener('touchstart',e=>{const t=e.changedTouches[0];if(!sidebarOpen){if(t.clientX<window.innerWidth*0.6){touchStartX=t.clientX;touchStartY=t.clientY;}else{touchStartX=0;}}else{touchStartX=t.clientX;touchStartY=t.clientY;}},{passive:true});
document.addEventListener('touchmove',e=>{if(!touchStartX)return;const t=e.changedTouches[0],dx=t.clientX-touchStartX,dy=Math.abs(t.clientY-touchStartY);if(!sidebarOpen&&dx>60&&dy<dx*1.5){touchStartX=0;toggleSidebar(true);}if(sidebarOpen&&dx<-60&&dy<Math.abs(dx)*1.5){touchStartX=0;toggleSidebar(false);}},{passive:true});

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function renderNoteItem(note) {
  const a = note.id === activeNoteId ? ' active' : '';
  return `<div class="sidebar-item${a}" data-type="note" data-note-id="${note.id}" draggable="true"><span class="item-icon">${renderIcon(note.icon)}</span><span class="item-name">${escHtml(note.title||'Без названия')}</span><span class="item-actions"><button data-action="rename">✏️</button><button data-action="icon">🎨</button><button data-action="delete">🗑️</button></span></div>`;
}
function renderExpandableNote(note) {
  const a = note.id === activeNoteId ? ' active' : '';
  const open = note._open !== false;
  const kids = (note.refNoteIds||[]).map(id=>data.notes[id]).filter(Boolean);
  if(!kids.length) return renderNoteItem(note);
  return `<div class="sidebar-note-group"><div class="sidebar-item${a}${open?' folder-hover':''}" data-type="note" data-note-id="${note.id}" draggable="true"><span class="item-icon"><span class="sidebar-folder-toggle ${open?'open':''}">▶</span><span class="folder-emoji">${renderIcon(note.icon)}</span></span><span class="item-name">${escHtml(note.title||'Без названия')}</span><span class="item-actions"><button data-action="rename">✏️</button><button data-action="icon">🎨</button><button data-action="delete">🗑️</button></span></div><div class="sidebar-folder-children ${open?'open':''}" data-note-parent="${note.id}">${kids.map(n=>renderNoteItem(n)).join('')}</div></div>`;
}

function renderSidebar() {
  let html = '';
  const folders = getFolders(), unfiled = getUnfiledNotes(), selId = data.selectedFolderId;
  for (const f of folders) {
    const notes = getNotesInFolder(f.id), open = f._open !== false;
    html += `<div class="sidebar-folder" data-folder-id="${f.id}"><div class="sidebar-item${f.id===selId?' selected':''}${open?' folder-hover':''}" data-folder-id="${f.id}" data-type="folder" draggable="false"><span class="item-icon"><span class="sidebar-folder-toggle ${open?'open':''}">▶</span><span class="folder-emoji">${renderIcon(f.icon||'file')}</span></span><span class="item-name">${escHtml(f.name)}</span><span class="item-actions"><button data-action="rename">✏️</button><button data-action="icon">🎨</button><button data-action="delete">🗑️</button></span></div><div class="sidebar-folder-children ${open?'open':''}" data-drop-folder="${f.id}">`;
    for (const n of notes) html += renderExpandableNote(n);
    html += `</div></div>`;
  }
  html += `<div data-drop-unfiled="true" class="unfiled-zone">`;
  for (const n of unfiled) html += renderExpandableNote(n);
  html += `</div>`;
  if (!folders.length && !unfiled.length) html += `<div class="sidebar-empty">Нет заметок.<br>Нажмите + чтобы создать</div>`;
  sidebarBody.innerHTML = html;

  sidebarBody.querySelectorAll('.sidebar-item[data-type="folder"]').forEach(el => {
    const fid = el.dataset.folderId, f = data.folders.find(x => x.id === fid);
    el.addEventListener('click', e => {
      if (e.target.closest('.item-actions')) return;
      f._open = f._open === false ? true : false;
      data.selectedFolderId = data.selectedFolderId === fid ? null : fid;
      saveDataToFirestore(); renderSidebar();
    });
    el.querySelectorAll('.item-actions button').forEach(btn => btn.addEventListener('click', async e => { e.stopPropagation();
      if (btn.dataset.action==='rename') { const n=await showPrompt('Название папки:',f?.name||''); if(n){f.name=n;saveDataToFirestore();renderSidebar();} }
      else if (btn.dataset.action==='icon') { showEmojiPicker(btn, emoji => { f.icon=emoji; saveDataToFirestore(); renderSidebar(); }); }
      else if (btn.dataset.action==='delete' && await showConfirm('Удалить папку?','Нет','Удалить')) { Object.values(data.notes).filter(x=>x.folderId===fid).forEach(x=>x.folderId=null); data.folders=data.folders.filter(x=>x.id!==fid); saveDataToFirestore(); renderSidebar(); }
    }));
  });

  sidebarBody.querySelectorAll('.sidebar-item[data-type="note"]').forEach(el => {
    const nid = el.dataset.noteId;
    el.addEventListener('click', e => {
      if (e.target.closest('.item-actions')) return;
      const note = data.notes[nid];
      if(note&&(note.refNoteIds||[]).length&&e.target.closest('.sidebar-folder-toggle')){note._open=note._open===false?true:false;saveDataToFirestore();renderSidebar();return;}
      if(Date.now()-noteMenuOpenSince<600){noteMenuOpenSince=0;return;}
      switchNote(nid); toggleSidebar(false);
    });
    el.querySelectorAll('.item-actions button').forEach(btn => btn.addEventListener('click', async e => { e.stopPropagation();
      const note = data.notes[nid]; if (!note) return;
      if (btn.dataset.action==='rename') { const t=await showPrompt('Название:',note.title||''); if(t!==null){note.title=t.trim();saveDataToFirestore();renderSidebar();updateNoteTitleInput();refreshNoteRefs();} }
      else if (btn.dataset.action==='icon') { showEmojiPicker(btn, emoji => { note.icon=emoji; saveDataToFirestore(); renderSidebar(); }); }
      else if (btn.dataset.action==='delete' && await showConfirm('Удалить заметку?','Нет','Удалить')) deleteNote(nid);
    }));
  });
}

  const nt=e.target.closest('.sidebar-item[data-type="note"]'); if(nt){e.stopPropagation();const tid=nt.dataset.noteId;if(tid===nid)return;const t=data.notes[tid];if(!t)return;if(note.folderId!==t.folderId)note.folderId=t.folderId;const s=note.folderId?getNotesInFolder(note.folderId):getUnfiledNotes();const idx=s.findIndex(x=>x.id===tid);if(idx>0)note.order=((s[idx-1]?.order||0)+t.order)/2;else if(s.length>1)note.order=t.order/2;else note.order=(t.order||0)+500;saveDataToFirestore();renderSidebar();if(note.id===activeNoteId)loadNoteIntoEditor(note.id);return;}

  const uz=e.target.closest('[data-drop-unfiled]'); if(uz){e.stopPropagation();note.folderId=null;const s=getUnfiledNotes();note.order=(s[s.length-1]?.order||0)+1000;saveDataToFirestore();renderSidebar();if(note.id===activeNoteId)loadNoteIntoEditor(note.id);}
});

editor.addEventListener('touchcancel',()=>{if(imgTouchDrag){clearTimeout(imgTouchDrag.timer);imgTouchDrag.img?.classList.remove('img-dragging');removeDropIndicator();imgTouchDrag=null;}},{passive:true});
editor.addEventListener('click', e => { const img=e.target.closest('img'); if(img){e.stopPropagation();selectImage(img);return;} deselectImage(); });
editor.addEventListener('keydown', e => { if(e.key==='Escape')deselectImage(); if((e.key==='Delete'||e.key==='Backspace')&&selectedImg){selectedImg.remove();deselectImage();saveCurrentNoteContent();} });
window.addEventListener('scroll', ()=>{if(selectedImg){positionFloatToolbar(selectedImg);positionResizeHandle(selectedImg);}});
window.addEventListener('resize', ()=>{if(selectedImg){positionFloatToolbar(selectedImg);positionResizeHandle(selectedImg);}});

// ─── Crop ──────────────────────────────────────────────
function startCrop() {
  if(!selectedImg)return; const src=selectedImg.src;
  const ov=document.createElement('div'); ov.className='crop-overlay';
  const wr=document.createElement('div'); wr.className='crop-wrap';
  const im=document.createElement('img'); im.src=src; im.className='crop-image'; wr.appendChild(im);
  const rg=document.createElement('div'); rg.className='crop-region'; wr.appendChild(rg);
  ['nw','n','ne','e','se','s','sw','w'].forEach(h=>{const e=document.createElement('div');e.className='crop-handle '+h;rg.appendChild(e);});
  const ac=document.createElement('div'); ac.className='crop-actions';
  const ap=document.createElement('button'); ap.textContent='Применить'; const ca=document.createElement('button'); ca.textContent='Отмена'; ca.className='crop-cancel';
  ac.append(ap,ca); wr.appendChild(ac); ov.appendChild(wr); document.body.appendChild(ov);
  function init(){const r=im.getBoundingClientRect();rg.style.left='4px';rg.style.top='4px';rg.style.width=(r.width-8)+'px';rg.style.height=(r.height-8)+'px';cropState={overlay:ov,img:im,region:rg,wrap:wr,handle:null,dragStartX:0,dragStartY:0,origL:0,origT:0,origW:r.width-8,origR:0,origB:0,origH:r.height-8,moving:false,moveStartX:0,moveStartY:0,moveL:0,moveT:0};}
  if(im.complete)init();else im.onload=init;
  document.addEventListener('mousemove',onCropMove);document.addEventListener('mouseup',onCropEnd);document.addEventListener('touchmove',onCropMove,{passive:false});document.addEventListener('touchend',onCropEnd);
  rg.addEventListener('mousedown',e=>{if(e.target.closest('.crop-handle'))return;e.preventDefault();const cs=cropState;if(!cs)return;cs.moving=true;cs.moveStartX=e.clientX;cs.moveStartY=e.clientY;cs.moveL=parseInt(rg.style.left);cs.moveT=parseInt(rg.style.top);});
  rg.addEventListener('touchstart',e=>{if(e.target.closest('.crop-handle'))return;const t=e.changedTouches[0];const cs=cropState;if(!cs)return;cs.moving=true;cs.moveStartX=t.clientX;cs.moveStartY=t.clientY;cs.moveL=parseInt(rg.style.left);cs.moveT=parseInt(rg.style.top);},{passive:false});
  rg.querySelectorAll('.crop-handle').forEach(h=>{
    h.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();const cs=cropState;if(!cs)return;cs.handle=h.className.replace('crop-handle ','');const rr=rg.getBoundingClientRect(),wr2=wr.getBoundingClientRect();cs.dragStartX=e.clientX;cs.dragStartY=e.clientY;cs.origL=rr.left-wr2.left;cs.origT=rr.top-wr2.top;cs.origW=rr.width;cs.origH=rr.height;cs.origR=cs.origL+cs.origW;cs.origB=cs.origT+cs.origH;});
    h.addEventListener('touchstart',e=>{const t=e.changedTouches[0];const cs=cropState;if(!cs)return;cs.handle=h.className.replace('crop-handle ','');const rr=rg.getBoundingClientRect(),wr2=wr.getBoundingClientRect();cs.dragStartX=t.clientX;cs.dragStartY=t.clientY;cs.origL=rr.left-wr2.left;cs.origT=rr.top-wr2.top;cs.origW=rr.width;cs.origH=rr.height;cs.origR=cs.origL+cs.origW;cs.origB=cs.origT+cs.origH;},{passive:false});
  });
  function cleanCrop(){document.removeEventListener('mousemove',onCropMove);document.removeEventListener('mouseup',onCropEnd);document.removeEventListener('touchmove',onCropMove);document.removeEventListener('touchend',onCropEnd);}
  ap.addEventListener('click',()=>{cleanCrop();applyCrop(ov,im,rg);});
  ca.addEventListener('click',()=>{cleanCrop();ov.remove();cropState=null;});
}
function gCX(e){return e.clientX!==undefined?e.clientX:e.changedTouches[0].clientX}
function gCY(e){return e.clientY!==undefined?e.clientY:e.changedTouches[0].clientY}
function onCropMove(e){const cs=cropState;if(!cs)return;e.preventDefault();const cx=gCX(e),cy=gCY(e);const{region,img:ci}=cs;if(cs.moving){let l=cs.moveL+(cx-cs.moveStartX),t=cs.moveT+(cy-cs.moveStartY);const wr=ci.getBoundingClientRect();l=Math.max(0,Math.min(wr.width-parseInt(region.style.width),l));t=Math.max(0,Math.min(wr.height-parseInt(region.style.height),t));region.style.left=l+'px';region.style.top=t+'px';return;}if(!cs.handle)return;let l=cs.origL,t=cs.origT,r=cs.origR,b=cs.origB;const dx=cx-cs.dragStartX,dy=cy-cs.dragStartY;if(cs.handle.includes('e'))r=cs.origR+dx;if(cs.handle.includes('w'))l=cs.origL+dx;if(cs.handle.includes('s'))b=cs.origB+dy;if(cs.handle.includes('n'))t=cs.origT+dy;const wr=ci.getBoundingClientRect();l=Math.max(0,l);t=Math.max(0,t);r=Math.min(wr.width,r);b=Math.min(wr.height,b);if(r-l<30){if(cs.handle.includes('e'))r=l+30;else l=r-30;}if(b-t<30){if(cs.handle.includes('s'))b=t+30;else t=b-30;}region.style.left=l+'px';region.style.top=t+'px';region.style.width=(r-l)+'px';region.style.height=(b-t)+'px';}
function onCropEnd(){if(cropState){cropState.handle=null;cropState.moving=false;}}
function applyCrop(ov,ci,rg){const r=rg.getBoundingClientRect(),i=ci.getBoundingClientRect();const sx=(r.left-i.left)*(ci.naturalWidth/i.width),sy=(r.top-i.top)*(ci.naturalHeight/i.height),sw=r.width*(ci.naturalWidth/i.width),sh=r.height*(ci.naturalHeight/i.height);const c=document.createElement('canvas');c.width=sw;c.height=sh;c.getContext('2d').drawImage(ci,sx,sy,sw,sh,0,0,sw,sh);if(selectedImg){selectedImg.src=c.toDataURL('image/png');selectedImg.removeAttribute('width');selectedImg.removeAttribute('height');selectedImg.removeAttribute('style');deselectImage();saveCurrentNoteContent();}ov.remove();cropState=null;}

// ─── Toolbar active state ──────────────────────────────
editor.addEventListener('keyup mouseup', () => { document.querySelectorAll('.bottom-dock [data-cmd]').forEach(b=>{const c=b.dataset.cmd;if(c==='formatBlock')return;try{b.classList.toggle('active',document.queryCommandState(c));}catch(_){}}); });

// ─── Width ─────────────────────────────────────────────
const widthSlider=document.getElementById('widthSlider'), widthBtnLabel=document.getElementById('widthBtnLabel'), widthLabel=document.getElementById('widthLabel'), widthHandle=document.getElementById('widthHandle'), widthPanel=document.getElementById('widthPanel'), widthBtn=document.getElementById('widthBtn'), wpLabel=document.getElementById('wpLabel');
function setWidthPct(p){p=Math.max(10,Math.min(100,p));editorWrapper.style.maxWidth=p+'%';widthSlider.value=p;widthBtnLabel.textContent=p+'%';widthLabel.textContent=p+'%';wpLabel.textContent=p+'%';localStorage.setItem('note-width-pct',p);}
function updateDock(){const h=widthPanel.classList.contains('open')||linkPanel.classList.contains('open');document.getElementById('bottomDock').classList.toggle('hidden',h);}
widthSlider.addEventListener('input',()=>setWidthPct(parseInt(widthSlider.value)));
widthBtn.addEventListener('mousedown',e=>{e.preventDefault();widthPanel.classList.toggle('open');updateDock();});
document.addEventListener('mousedown',e=>{if(widthPanel.classList.contains('open')&&!widthPanel.contains(e.target)&&!e.target.closest('#widthBtn')&&!e.target.closest('#widthBtnMobile')){widthPanel.classList.remove('open');updateDock();}});
let isDragging=false; widthHandle.addEventListener('mousedown',e=>{isDragging=true;widthHandle.classList.add('active');e.preventDefault();});
document.addEventListener('mousemove',e=>{if(!isDragging)return;setWidthPct(Math.max(10,Math.min(100,Math.round((e.clientX/window.innerWidth)*100))));});
document.addEventListener('mouseup',()=>{if(isDragging){isDragging=false;widthHandle.classList.remove('active');}});



// ─── Save indicator ────────────────────────────────────
const saveIndicator=document.getElementById('saveIndicator');
editor.addEventListener('input',()=>{lastEditTime=Date.now();const n=getActiveNote();if(n){n.content=editor.innerHTML;n.updatedAt=Date.now();saveDataToFirestore();saveIndicator.classList.add('show');clearTimeout(saveIndicator._timer);saveIndicator._timer=setTimeout(()=>saveIndicator.classList.remove('show'),1200);}});
editor.addEventListener('click',e=>{if(e.target.tagName==='A')e.preventDefault();});

// ─── Init ──────────────────────────────────────────────
function initApp() {
  const p=parseInt(localStorage.getItem('note-width-pct')); setWidthPct(p>=10&&p<=100?p:80);
  if(activeNoteId&&data.notes[activeNoteId])loadNoteIntoEditor(activeNoteId);
  else{const k=Object.keys(data.notes||{});if(k.length){activeNoteId=k[0];data.activeNoteId=k[0];loadNoteIntoEditor(k[0]);}}
  renderSidebar();
}
</script>
